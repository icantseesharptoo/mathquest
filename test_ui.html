<!DOCTYPE html><html><head><meta charset="utf-8"><title>ui test</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/tools.css"><link rel="stylesheet" href="css/intro.css"><link rel="stylesheet" href="css/scale.css"></head><body>

<script>localStorage.clear();location.hash='#/y8/l/5/practice';window.confirm=()=>true;window.NO_BFS=true;
const DAY=new Date();DAY.setHours(0,0,0,0);let FAKE=DAY.getTime()+7*3600e3;window.LT_CLOCK=()=>FAKE;const at=(h,m,s=0)=>{FAKE=DAY.getTime()+((h*60+m)*60+s)*1000;ltTick()};</script>
<script src="data/y8.js"></script><script src="data/y10.js"></script><script src="data/extras.js"></script><script src="js/lib.js"></script><script src="js/g_number.js"></script><script src="js/g_algebra.js"></script><script src="js/g_geometry.js"></script><script src="js/g_data.js"></script><script src="js/g_y8.js"></script><script src="js/g_extra.js"></script><script src="js/engine.js"></script><script src="js/demos.js"></script><script src="js/timer.js"></script><script src="js/tools.js"></script><script src="js/board.js"></script><script src="js/ivideo.js"></script><script src="js/intro.js"></script><script src="js/ui.js"></script>
<script>
const out=[],bad=[];const log=s=>out.push(s),fail=s=>{bad.push(s);out.push('FAIL '+s)};
const fill=c=>{const p=c.p;if(p.mc){c.el.querySelector(`input[value="${p.ans}"]`).checked=true}else{c.el.querySelector('input[type=text]').value=p.ansStr?p.ansStr.split(' ')[0].replace(/−/g,'-'):String(p.ans)}};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
(async()=>{
 try{
  await wait(200);
  let cards=CARDS();log('practice cards '+cards.length);
  cards.forEach(c=>{fill(c);c.el.querySelector('.chk').click()});
  if(!cards.every(c=>c.ok===true))fail('practice: not all correct after fill');
  log('progress: '+JSON.stringify(ST.done));
  // course pages
  for(const cid of COURSE_IDS){location.hash='#/'+cid;await wait(80);const mods=document.querySelectorAll('section.module').length,cs=document.querySelectorAll('.tcard').length;log(`${cid}: ${mods} module sections, ${cs} topic cards`);if(cs!==allLessons(cid).length)fail(cid+' card count');
    const s=document.querySelector('.search');s.value='prob';s.dispatchEvent(new Event('input'));log(`  search "prob": ${[...document.querySelectorAll('.tcard')].filter(c=>c.style.display!=='none').length} cards`)}
  // every topic's slides: walk all slides, press every step
  for(const cid of COURSE_IDS)for(const l of allLessons(cid)){
    location.hash=`#/${cid}/l/${l.n}/slides`;await wait(20);
    const names=[];for(let i=0;i<14;i++){names.push(document.getElementById('dn').textContent);if(DECK.h.stepNext){let k=0;while(DECK.h.stepNext()&&k<20)k++}
      if(/undefined|NaN/.test(document.getElementById('stage').innerHTML))fail(`${cid} ${l.n} slide ${names[i]} has undefined/NaN`);const b=document.getElementById('nt');if(b.disabled)break;b.click()}
    if(l.n===1||l.n===34)log(`${cid} topic ${l.n} slides: ${names.join(' | ')}`);
    if(l.videos&&!names.includes('Video'))fail('video slide missing '+cid+l.n);
  }
  // example slide reveals steps and final answer
  location.hash='#/y8/l/34/slides';await wait(30);while(document.getElementById('dn').textContent!=='Example 1')document.getElementById('nt').click();
  const fig0=document.querySelector('.exfig').innerHTML;DECK.h.stepNext();DECK.h.stepNext();DECK.h.stepNext();
  log('example: steps shown '+document.querySelectorAll('.steplist li').length+', figure changed: '+(document.querySelector('.exfig').innerHTML!==fig0));
  while(DECK.h.stepNext());if(!document.querySelector('.steplist li.final'))fail('example final answer not shown');
  // wheel
  while(document.getElementById('dn').textContent!=='Random problem')document.getElementById('nt').click();
  document.querySelector('.spinw').click();await wait(3400);log('wheel picked: '+document.querySelector('.wheelq .big').textContent+' with card '+!!document.querySelector('.wheelq .q'));
  // videos tab
  location.hash='#/y8/l/2/videos';await wait(30);log('videos tab iframes: '+document.querySelectorAll('.yt iframe').length+' src '+document.querySelector('.yt iframe').src);
  // timer: manual 40 minutes outside the lesson times
  const lt=()=>document.querySelector('#hdrTimer .lt'),lab=()=>lt().querySelector('.ltlab').textContent,tm=()=>lt().querySelector('.ltime').textContent,

  at(7,0);log(`7:00 -> ${lab()} ${tm()}`);if(tm()!=='40:00')fail('manual timer start value');
  lt().querySelector('[data-lt=toggle]').click();at(7,0,2);if(!toasts().includes('Lesson has started'))fail('start toast');clearT();

  const seen=[];for(const [h,m] of [[9,20],[9,28],[9,36],[9,48]]){at(h,m,3);seen.push(...toasts());clearT()}log('9:20–9:48 milestones: '+seen.join(' | '));if(seen.length!==4)fail('milestones');
  at(9,50,2);if(!toasts().includes('5 minutes left'))fail('slot warning');clearT();
  at(9,55,1);log(`9:55 -> ${lab()} ${tm()} (${lt().querySelector('.ltrange').textContent}) toasts ${toasts()} · ${document.querySelector('.lttoast.over div')?.textContent}`);if(lab()!=='Break'||!toasts().includes('Lesson 2 is over'))fail('break');clearT();
  at(9,59,10);log('9:59 -> '+toasts());if(!toasts().includes('Lesson 3 starts in 1 minute'))fail('lesson soon');clearT();
  at(10,5);lt().querySelector('[data-lt=toggle]').click();log(`10:05 pause -> ${lab()} ${tm()}, auto button shown ${!lt().querySelector('[data-lt=auto]').hidden}`);if(lab()!=='Lesson'||tm()!=='35:00')fail('pause in slot');
  at(10,7);if(tm()!=='35:00')fail('paused timer moved');lt().querySelector('[data-lt=auto]').click();log(`back to auto: ${lab()} ${tm()}`);if(lab()!=='Lesson 3'||tm()!=='33:00')fail('back to auto');
  at(10,30);lt().querySelector('[data-lt=reset]').click();at(10,41);log(`override ends with the lesson: 10:41 -> ${lab()} ${tm()}`);if(tm()!=='40:00')fail('override end');clearT();
  localStorage.setItem('maths.slots','8:00-8:45');at(8,10);log(`custom times 8:00-8:45 at 8:10: ${lab()} ${tm()}`);if(lab()!=='Lesson 1'||tm()!=='35:00')fail('custom slots');
  localStorage.removeItem('maths.slots');at(7,0);clearT();
  // exit ticket for every topic: 20 blocks, 4 distinct options, exactly one correct
  let xtSame=0,xtTot=0;
  for(const cid of COURSE_IDS)for(const l of allLessons(cid)){
    const ps=exitTicketSet(l,l.n*31+7);xtTot++;
    if(ps.length!==20)fail(`exit ticket size ${cid} ${l.n}`);
    const shapes=new Set(ps.map(shapeOf));if(shapes.size===1)xtSame++;
    ps.forEach((p,i)=>{const o=p.opts;if(o.list.length!==4||new Set(o.list).size!==4)fail(`exit ticket options ${cid} ${l.n} #${i}: ${o.list.join(' | ')}`);
      if(/NaN|undefined|Infinity/.test(o.list.join('')+p.text))fail(`exit ticket text ${cid} ${l.n}`);
      if(!p.mc){const okv=o.list[o.ok].replace(p.unit||'','');if(!checkAnswer(p,okv.replace(/−/g,'-')))fail(`exit ticket correct option rejected ${cid} ${l.n}: ${okv} vs ${ansText(p)}`);
        o.list.forEach((t,j)=>{if(j!==o.ok&&checkAnswer(p,t.replace(p.unit||'','').replace(/−/g,'-')))fail(`exit ticket two right options ${cid} ${l.n}: ${t}`)})}});
  }
  log(`exit tickets: ${xtTot} topics, ${xtSame} use one question shape for all 20 blocks`);
  location.hash='#/y8/l/34/slides';await wait(30);document.querySelector('.deckbar [data-tool=exit]').click();
  log('exit ticket overlay blocks: '+document.querySelectorAll('.xtb').length);
  const b0=document.querySelector('.xtb');b0.querySelectorAll('.xto button')[0].click();log('exit ticket after one answer: '+document.querySelector('.xtscore').textContent);
  closeOverlay();
  // battle: wrong answer on the left, right answer on the right
  for(const n of [34,2,51]){location.hash=`#/y8/l/${n}/slides`;await wait(30);document.querySelector('.deckbar [data-tool=battle]').click();
    const ov=document.querySelector('.battle'),press=(s,txt)=>{for(const ch of txt){const k=ch==='-'?'−':ch;[...ov.querySelectorAll(`.bside[data-s=${s}] .bpad button`)].find(b=>b.dataset.k===k).click()}ov.querySelector(`.bside[data-s=${s}] .bgo`).click()};
    ov.querySelector('.bstart').click();press('L','98765');
    const p=ov.qs.R,typed=p.mc?String(p.ans+1):String(p.ansStr?p.ansStr.split(' ')[0]:fmtNum(p.ans)).replace(/−/g,'-');press('R',typed);
    const won=ov.querySelector('.bside[data-s=R]').classList.contains('win');if(!won)fail(`battle ${n}: right side did not win with ${typed}`);
    log(`battle ${n}: left wrong -> "${ov.querySelector('.bside[data-s=L] .bmsg').textContent.trim()}"; right typed ${typed} -> win=${won}, score L${ov.score.L}:R${ov.score.R}`);
    closeOverlay();}
  // whiteboard: draw, undo, text
  document.querySelector('#toolsMenu [data-tool=board]').click();await wait(50);
  const cv=document.querySelector('.wbcanvas'),r=cv.getBoundingClientRect(),ev=(t,x,y)=>cv.dispatchEvent(new PointerEvent(t,{clientX:r.left+x,clientY:r.top+y,pointerId:1,bubbles:true,pointerType:'mouse'}));
  const ink=()=>{const d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data;let n=0;for(let i=3;i<d.length;i+=4)if(d[i])n++;return n};
  ev('pointerdown',50,50);ev('pointermove',150,120);ev('pointermove',250,60);ev('pointerup',250,60);const inked=ink();
  document.querySelector('.wbbar [data-a=undo]').click();log(`whiteboard: canvas ${cv.width}x${cv.height}, ink after stroke ${inked}, after undo ${ink()}`);if(inked<300||ink())fail('whiteboard draw/undo');
  closeOverlay();
  // whiteboard dot tool and task mode
  document.querySelector('#toolsMenu [data-tool=board]').click();await wait(50);
  {const o=document.querySelector('.ovl.wb'),cv=o.querySelector('.wbcanvas'),r=cv.getBoundingClientRect(),pe=(t,x,y)=>cv.dispatchEvent(new PointerEvent(t,{clientX:x,clientY:y,pointerId:1,bubbles:true,pointerType:'mouse'}));
   const ink=()=>{const d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data;let n=0;for(let i=3;i<d.length;i+=4)if(d[i])n++;return n};
   o.querySelector('[data-t=dot]').click();const i0=ink();pe('pointerdown',r.left+80,r.top+80);pe('pointerup',r.left+80,r.top+80);log(`dot tool: ink ${i0} -> ${ink()}`);if(ink()<=i0)fail('dot tool');
   o.querySelector('[data-a=undo]').click();
   o.querySelector('[data-a=task]').click();await wait(30);
   const at=(x,y)=>{const G=o.G(),b=cv.getBoundingClientRect();return [b.left+G.ox+x*G.u,b.top+G.oy-y*G.u]};
   const dot=(x,y)=>{o.querySelector('[data-t=dot]').click();pe('pointerdown',...at(x,y));pe('pointerup',...at(x,y))};
   const line=(a,b,c,d)=>{o.querySelector('[data-t=line]').click();pe('pointerdown',...at(a,b));pe('pointermove',...at((a+c)/2,(b+d)/2));pe('pointermove',...at(c,d));pe('pointerup',...at(c,d))};
   const types={};let bad=0;
   for(let k=0;k<60;k++){
     o.querySelector('[data-k=new]').click();const T=WB.task;types[T.type]=(types[T.type]||0)+1;
     if(/undefined|NaN/.test(T.text))fail('task text '+T.text);
     T.dots.forEach(d=>dot(d.x,d.y));T.segs.forEach(s=>line(...s));
     T.lines.forEach(L=>L.v!=null?line(L.v,-3,L.v,3):line(-2,L.m*-2+L.c,2,L.m*2+L.c));
     o.querySelector('[data-k=check]').click();const res=o.querySelector('.wbres').textContent;
     if(!/All correct/.test(res)){bad++;fail(`task ${T.type} "${T.text}" -> ${res}`)}
     if(k===0||k===1)log(`task: ${T.text.replace(/<[^>]+>/g,' ')} -> ${res}`);
     if(k===2){dot(T.dots.length?T.dots[0].x+1:1,1);o.querySelector('[data-k=check]').click();log('with a wrong extra dot: '+o.querySelector('.wbres').textContent);if(/All correct/.test(o.querySelector('.wbres').textContent))fail('wrong dot accepted')}
   }
   log('task types: '+JSON.stringify(types));
   const nm=WB.marks.length;o.querySelector('[data-a=undo]').click();if(WB.marks.length!==nm-1)fail('undo task mark');
   o.querySelector('[data-k=answer]').click();o.querySelector('[data-a=task]').click();closeOverlay();}
  // exit ticket text fits its blocks at this screen size
  location.hash='#/y8/l/46/slides';await wait(30);document.querySelector('.deckbar [data-tool=exit]').click();await wait(60);
  {const o=document.querySelector('.ovl.xt'),ov=[...o.querySelectorAll('.xtq')].filter(q=>q.scrollHeight>q.clientHeight+1).length;log(`exit ticket font ${o.xtf}px at ${innerWidth}x${innerHeight}, overflowing blocks ${ov}`);if(ov)fail('exit ticket overflow');closeOverlay()}
  // title slide animation and "Why it matters"
  location.hash='#/y8/l/2/slides';await wait(30);
  if(document.getElementById('dn').textContent!=='Title')fail('first slide is not Title');
  const tl=DECK.h.titleLetters;let anim=0;for(let k=0;k<30;k++){await wait(200);if(document.getAnimations().some(a=>tl.includes(a.effect&&a.effect.target)))anim++}
  log(`title: ${tl.length} letters, animated in ${anim}/30 checks, nail seen: ${!!document.querySelector('.tl.nail-l,.tl.nail-r')||'not in this window'}`);if(!anim)fail('title letters not animated');
  document.getElementById('nt').click();log('slide 2: '+document.getElementById('dn').textContent+', pending parts '+document.querySelectorAll('#stage .pending').length);
  while(DECK.h.stepNext());if(document.querySelector('#stage .pending'))fail('why slide not fully revealed');
  log('fun videos: '+document.querySelectorAll('#stage .fv').length+' · fact: '+document.querySelector('.whyc.fact p').textContent.slice(0,60)+'…');
  let noX=0;for(const cid of COURSE_IDS)for(const l of allLessons(cid)){const x=extrasFor(cid,l);if(!x||!x.fact||!x.use)fail('no extras '+cid+' '+l.title);else if(!x.videos.length)noX++}
  log('topics without fun videos: '+noX);

  window.IV_FORCE=true;let MOCK=null;
  window.YT={Player:class{constructor(id,o){this.o=o;this.t=0;this.state=-1;MOCK=this;setTimeout(()=>o.events.onReady(),5)}getCurrentTime(){return this.t}getDuration(){return 300}pauseVideo(){this.state=2}playVideo(){this.state=1}seekTo(t){this.t=t}destroy(){}}};
  localStorage.removeItem('maths.ivideo');
  const ivh=interactiveVideo('y8',lessonN('y8',34),'TESTVID');document.body.appendChild(ivh);await wait(60);ivh.ivTick();
  const nm=ivh.querySelectorAll('.ivm').length;MOCK.playVideo();if(getComputedStyle(ivh.querySelector('.ivq')).display!=='none')fail('question overlay visible before its time');
  for(let t=0;t<=95;t+=0.5){MOCK.t=t;ivh.ivTick();if(!ivh.querySelector('.ivq').hidden)break}
  const q1=!ivh.querySelector('.ivq').hidden;log(`interactive video: ${nm} markers, stopped at ${MOCK.t}s: ${q1}, paused ${MOCK.state===2}, options ${ivh.querySelectorAll('.ivopts button').length}`);
  if(nm!==3||!q1||MOCK.state!==2)fail('interactive video checkpoint');
  if(!ivh.querySelector('.ivx').hidden)fail('close shown before answering');ivh.querySelector('.ivopts button').click();if(ivh.querySelector('.ivx').hidden)fail('no close button after answering');ivh.querySelector('.ivx').click();if(MOCK.state!==1||getComputedStyle(ivh.querySelector('.ivq')).display!=='none')fail('interactive video close');
  ivh.querySelector('.ivedit').click();MOCK.t=120;ivh.querySelector('.ivedit').click();ivh.querySelector('.ivedit').click();ivh.querySelector('.ivaddt').click();
  const saved=JSON.parse(localStorage.getItem('maths.ivideo')).TESTVID.cps.map(c=>c.t);log('after adding a question at 2:00: '+saved.join(', ')+' s');if(saved.length!==4)fail('add checkpoint');
  ivh.querySelector('.ivaddo').click();const f=ivh.querySelector('.ivown');f.text.value='What is 2+2?';f.right.value='4';f.w1.value='5';f.w2.value='3';f.requestSubmit();
  ivh.querySelector('.ivedit').click();MOCK.playVideo();
  let stops=0;for(let t=110;t<=300;t+=0.5){MOCK.t=t;ivh.ivTick();if(!ivh.querySelector('.ivq').hidden){stops++;const own=ivh.querySelector('.ivqq').textContent.includes('2+2');ivh.querySelector('.ivopts button').click();ivh.querySelector('.ivgo').click();if(own)log('own question shown at '+t+' s')}}
  MOCK.o.events.onStateChange({data:0});const sq=ivh.querySelectorAll('.ivsq').length;ivh.querySelectorAll('.ivsq').forEach(s=>s.querySelector('.ivopts button').click());
  log(`stops after 2:00: ${stops}; summary questions ${sq}; result: ${(ivh.querySelector('.ivscore')||{}).textContent}`);if(stops!==4||sq!==3||!ivh.querySelector('.ivscore'))fail('interactive video summary');
  ivh.remove();window.IV_FORCE=false;localStorage.removeItem('maths.ivideo');

  location.hash='#/exam/y8-m1';await wait(50);document.getElementById('start').click();cards=CARDS();log('exam questions '+cards.length);
  cards.slice(0,9).forEach(fill);document.getElementById('sub').click();log('result: '+document.querySelector('.result').textContent);
  location.hash='#/exams';await wait(50);log('exam links: '+document.querySelectorAll('.examlink').length+' best badge: '+(document.querySelector('.best')||{}).textContent);
  for(const h of ['#/','#/y10','#/exam/y10-final','#/exam/y10-m3','#/y10/l/30/practice']){location.hash=h;await wait(40);if(/undefined|NaN/.test(app.innerHTML))fail('undefined on '+h)}
 }catch(e){fail('ERR '+e.stack)}
 document.getElementById('res').textContent=`UI ${bad.length} failures\n`+out.join('\n');document.title='UITEST done '+bad.length;
})();
